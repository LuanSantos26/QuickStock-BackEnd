spring.application.name=QuickStock-BackEnd

# ── PostgreSQL ─────────────────────────────────────────────────
# Ajuste a porta, nome do banco, usuário e senha conforme seu ambiente local
spring.datasource.url=jdbc:postgresql://localhost:5432/quickstock
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update → cria/atualiza tabelas automaticamente; use validate em produção
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Porta da API ───────────────────────────────────────────────
server.port=8080

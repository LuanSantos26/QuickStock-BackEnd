# Perfil "test": banco EXCLUSIVO de testes, recriado a cada execução (create-drop).
# Nunca aponte para o banco real; o BancoDeTeste recusa URLs que não terminem em "_test".
spring.datasource.url=jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5432}/${TEST_DB_NAME:stock4event_test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=always

# Sem avanço automático de status por tempo: os testes controlam o fluxo.
stock4event.pedidos.status-automatico=false
stock4event.seguranca.swagger-publico=false

jwt.secret=ChaveDeTesteStock4eventComMaisDe32Caracteres!!
jwt.expiration-ms=3600000

upload.dir=target/test-uploads/produtos
logging.level.org.hibernate.SQL=WARN

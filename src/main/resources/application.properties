spring.application.name=Stock4event-BackEnd

# ── PostgreSQL ─────────────────────────────────────────────────
# Ajuste a porta, nome do banco, usuário e senha conforme seu ambiente local
spring.datasource.url=jdbc:postgresql://localhost:5432/stock4event
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.encoding=UTF-8
spring.datasource.hikari.connection-init-sql=SET client_encoding TO 'UTF8'

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update → cria/atualiza tabelas automaticamente; use validate em produção
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ── Porta da API ───────────────────────────────────────────────
server.port=8081

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ── JWT ────────────────────────────────────────────────────────
jwt.secret=Stock4eventDevSecretKey2026Minimo32Chars!!
jwt.expiration-ms=86400000

# ── Upload de imagens ──────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=uploads/produtos

# Cria um atalho direto para o Swagger
springdoc.swagger-ui.path=/swagger
# Pedidos avançam sozinhos de status (20 s: em rota, 55 s: entregue) para a demo.
# Com false, só o fornecedor muda o status pelo app.
stock4event.pedidos.status-automatico=true

# Swagger sem login: útil em desenvolvimento. Em produção, deixe false (padrão do código).
stock4event.seguranca.swagger-publico=true
